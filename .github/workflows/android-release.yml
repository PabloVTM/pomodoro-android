name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run unit tests
      run: ./gradlew test

    - name: Run lint
      run: ./gradlew lintDebug

  build-and-sign:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Le secret KEYSTORE est manquant ou vide."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

    - name: Build and sign release APKs and bundle
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload phone APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Upload wear APK
      uses: actions/upload-artifact@v4
      with:
        name: wear-release-apk
        path: wear/build/outputs/apk/release/wear-release.apk
        if-no-files-found: error

    - name: Upload Android App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/app-release.apk
          wear/build/outputs/apk/release/wear-release.apk
          app/build/outputs/bundle/release/app-release.aab

    - name: Clean up keystore
      if: always()
      run: rm -f keystore.jks
