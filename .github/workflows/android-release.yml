name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Signature optionnelle : tant que les secrets KEYSTORE / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD ne sont pas définis, les APK sont non signés.
# Les renseigner (au passage sur main) suffit à activer la signature, sans
# modifier ce fichier.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run unit tests
      run: ./gradlew test

    - name: Run lint
      run: ./gradlew lintDebug

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode keystore
      if: env.KEYSTORE_BASE64 != ''
      run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

    - name: Build release APKs and bundle
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload phone APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload wear APK
      uses: actions/upload-artifact@v4
      with:
        name: wear-release-apk
        path: wear/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload Android App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
          wear/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/app-release.aab

    - name: Clean up keystore
      if: always()
      run: rm -f keystore.jks
