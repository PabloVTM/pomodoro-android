name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Validate Gradle wrapper
      run: ./gradlew --version

    - name: Run unit tests
      run: ./gradlew test

    - name: Run lint
      run: ./gradlew lintDebug

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Aucun keystore n'est fourni ici : les APK sont produits non signés
    # (app-release-unsigned.apk / wear-release-unsigned.apk).
    # La signature sera activée sur main via le workflow de release.
    - name: Build unsigned release APKs
      run: ./gradlew assembleRelease

    - name: Upload phone APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload wear APK
      uses: actions/upload-artifact@v4
      with:
        name: wear-release-unsigned-apk
        path: wear/build/outputs/apk/release/*.apk
        if-no-files-found: error
